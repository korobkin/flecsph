variables:
  #CI_DEBUG_TRACE: "true"
  GET_SOURCES_ATTEMPTS: 10
  ARTIFACT_DOWNLOAD_ATTEMPTS: 10
  RESTORE_CACHE_ATTEMPTS: 10
  GIT_STRATEGY: fetch
  GLOBAL_CI_VARIABLE: "global_ci_value"
  http_proxy: "http://proxyout.lanl.gov:8080"
  https_proxy: "http://proxyout.lanl.gov:8080"
  ftp_proxy: "http://proxyout.lanl.gov:8080"
  no_proxy: "lanl.gov"
  GIT_SUBMODULE_STRATEGY: recursive
  CCACHE_DIR: "${CI_PROJECT_DIR}/ccache"
  CCACHE_UMASK: 000
  DISTRO: "centOS"
  RUNTIME: "mpi"
  BUILD_TYPE: "Debug"
  CC: "gcc"
  CXX: "g++"
  CXXFLAGS: "-Werror -Wno-return-type -Wno-deprecated-declarations"
  IGNORE_NOCI: "FALSE"
  SPACK_ROOT: /home/gitlab-runner/ci-spack/spack
  DEPS_LOCK: /home/gitlab-runner/ci-spack/deps.pid
  #lock_fd: 314
  FLECSI_CI_JOB_NAME_NOSTAGE: ${CI_JOB_NAME#*:}
  FLECSI_MPI_PACKAGE: ""
  FLECSI_INTEL_VERSION: "19.0.2"
  FLECSI_CLANG_VERSION: "8.0.1"
  FLECSI_GCC_VERSION: "8.3.0"
  FLECSI_SPACK_BASE_SPEC: "flecsph%gcc@${FLECSI_GCC_VERSION} ^openmpi@3.1.3%gcc@${FLECSI_GCC_VERSION}"


  #FLECSI_ENV_SOURCE_FILE: "${CI_PROJECT_DIR}/flecsi-deps-${FLECSI_MPI_PACKAGE}-${CI_COMMIT_REF_SLUG}-${CI_CONCURRENT_ID}.sh"
  #FLECSI_SPACK_SPEC: "flecsi%gcc@${FLECSI_GCC_VERSION} ~graphviz backend=${RUNTIME} ^${FLECSI_MPI_PACKAGE}"

before_script:
  - '[ "$(git rev-parse origin/$CI_COMMIT_REF_NAME)" != "$CI_COMMIT_SHA" ] && curl --header "PRIVATE-TOKEN: $MY_CI_API_TOKEN" -X POST https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/cancel'
  #- find . -name "`basename cinch`" | grep "cinch\$" | xargs rm -fr
  - export HOME=${CI_PROJECT_DIR}
  - mkdir -p ${CI_PROJECT_DIR}/build
  - module load clang/7.0.0 # for formatting purpose
  - module unload gcc
  - module load gcc/${FLECSI_GCC_VERSION}
  #- echo ${FLECSI_ENV_SOURCE_FILE}
  - export FLECSI_SPACK_FULL_SPEC="${FLECSI_SPACK_BASE_SPEC}"
  - rm ${FLECSI_ENV_SOURCE_FILE} || /bin/true
  - git clone git@gitlab.lanl.gov:laristra/ristra_spackages.git
  - |
    ( flock -e 200
    source ${SPACK_ROOT}/share/spack/setup-env.sh;
    spack repo rm lanl_ristra_flecsph || /bin/true; 
    spack repo rm lanl_ristra || /bin/true ;
    spack repo add ${CI_PROJECT_DIR}/ristra_spackages/spack-repo;
    spack repo add spack-repo;
    spack repo list;
    echo ${FLECSI_SPACK_FULL_SPEC};
    spack build-env --dump "flecsph-dependencies.sh" "${FLECSI_SPACK_FULL_SPEC}" || /bin/true;
    spack repo rm lanl_ristra_flecsph;
    spack repo rm lanl_ristra;
    ) 200>${DEPS_LOCK}
  - source "flecsph-dependencies.sh" || /bin/true
  - cat "flecsph-dependencies.sh" || /bin/true
  - ls /home/gitlab-runner/ci-spack/spack/opt/spack/linux-centos7-skylake_avx512/gcc-8.3.0/flecsi-master-xd2qmwonnbv2utb7pxmmcdskxcgdk2nd
  - ls /home/gitlab-runner/ci-spack/spack/opt/spack/linux-centos7-skylake_avx512/gcc-8.3.0/
  - |
    if [[ ${CI_JOB_NAME} =~ "clang" ]];
    then
      module unload clang;
      module load clang/${FLECSI_CLANG_VERSION};
    elif [[ ${CI_JOB_NAME} =~ "intel" ]];
    then
      module load intel/${FLECSI_INTEL_VERSION};
    fi
  - module list
  - echo $CC
  - echo $CXX
  - echo $CMAKE_PREFIX_PATH


.shell_template: &shell_def
  tags: &shell_tags
    - shell


job_build: 
  <<: *shell_def
  script: 
    - cd build
    - cmake ../ 
    - make 
